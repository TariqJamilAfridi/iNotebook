<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#6c63ff"/>
      <stop offset="100%" stop-color="#9c96ff"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#e8e6ff" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Rounded background square -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bgGrad)"/>

  <!-- Notebook spine (left dark bar) -->
  <rect x="10" y="10" width="8" height="44" rx="3" ry="3" fill="rgba(0,0,0,0.25)"/>

  <!-- Notebook page (white area) -->
  <rect x="17" y="10" width="36" height="44" rx="3" ry="3" fill="url(#pageGrad)"/>

  <!-- Spiral binding rings on spine -->
  <circle cx="14" cy="21" r="3" fill="none" stroke="#ffffff" stroke-width="1.8"/>
  <circle cx="14" cy="32" r="3" fill="none" stroke="#ffffff" stroke-width="1.8"/>
  <circle cx="14" cy="43" r="3" fill="none" stroke="#ffffff" stroke-width="1.8"/>

  <!-- Ruled lines on page -->
  <line x1="22" y1="22" x2="48" y2="22" stroke="#c4bfff" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="29" x2="48" y2="29" stroke="#c4bfff" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="36" x2="40" y2="36" stroke="#c4bfff" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="43" x2="44" y2="43" stroke="#e0ddff" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Bookmark ribbon (top-right corner) -->
  <polygon points="47,10 53,10 53,22 50,19 47,22" fill="#eb3b5a"/>
</svg>
